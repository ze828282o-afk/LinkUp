<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B0E">
  <title>LinkUp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0A0B0E; --card: #14161B; --elev: #1B1E26;
      --gold: #C8A265; --gold-hi: #DFBA7E; --bronze: #8C734B;
      --text: #F5F5F7; --muted: #8E929B; --line: #232730; --danger: #E24B4B;
      --brand: 'Cinzel', serif; --body: 'Tajawal', sans-serif;
      --grad: linear-gradient(135deg, #FFE3A3 0%, var(--gold) 60%, var(--bronze) 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); display: flex; justify-content: center; overflow: hidden; }
    button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: none; }
    input, textarea { font-family: inherit; }
    img, video { max-width: 100%; }
    .muted { color: var(--muted); }
    .center { text-align: center; padding: 22px 12px; font-size: 13px; }

    #app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; position: relative; overflow: hidden; background: var(--bg); border-inline: 1px solid var(--line); }

    /* ---------- splash + auth ---------- */
    #splash { position: absolute; inset: 0; z-index: 400; background: var(--bg); display: flex; align-items: center; justify-content: center; }
    .grad-text { font-family: var(--brand); font-weight: 700; background: linear-gradient(135deg, #FFF1CE 0%, var(--gold) 50%, var(--bronze) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #auth-screen { position: absolute; inset: 0; z-index: 300; background: var(--bg); display: none; flex-direction: column; justify-content: center; padding: 22px; overflow-y: auto; }
    .auth-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 26px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.7); }
    .auth-view { display: flex; flex-direction: column; gap: 12px; }
    .auth-input-group { display: flex; flex-direction: column; gap: 5px; }
    .auth-input-group label { font-size: 12px; color: var(--gold); }
    .row-between { display: flex; justify-content: space-between; align-items: center; }
    .link-btn { font-size: 12px; color: var(--muted); }
    .link-btn:hover { color: var(--gold); text-decoration: underline; }
    .auth-input { width: 100%; background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: #fff; outline: none; font-size: 16px; }
    .auth-input:focus { border-color: var(--gold); }
    textarea.auth-input { resize: none; min-height: 84px; }
    .otp-input { letter-spacing: 10px; text-align: center; font-weight: 700; color: var(--gold); font-size: 22px; }
    .gold-btn { background: var(--grad); color: #0A0B0E; font-weight: 700; padding: 13px; border-radius: 12px; font-size: 14px; }
    .gold-btn:active { opacity: .85; }
    .gold-btn:disabled, .ghost-btn:disabled { opacity: .5; cursor: default; }
    .ghost-btn { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ghost-btn.gold { border-color: var(--gold); color: var(--gold); }
    .ghost-btn.danger { color: var(--danger); border-color: rgba(226,75,75,.4); }
    .google-btn { background: #fff; color: #1F1F1F; font-weight: 600; padding: 12px; border-radius: 12px; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* ---------- header / nav ---------- */
    .top-header { height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(10,11,14,.9); backdrop-filter: blur(12px); position: absolute; top: 0; inset-inline: 0; z-index: 50; }
    .brand-logo { font-size: 24px; }
    .header-actions { display: flex; gap: 4px; }
    .icon-btn { color: var(--gold); font-size: 18px; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; position: relative; }
    .icon-btn:active { background: var(--elev); }
    .main-viewport { position: absolute; top: 60px; bottom: 65px; inset-inline: 0; overflow: hidden; }
    .screen { display: none; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active { display: block; }
    #screen-chat.active { display: flex; flex-direction: column; }

    .bottom-nav { height: 65px; background: rgba(14,16,21,.96); border-top: 1px solid var(--line); position: absolute; bottom: 0; inset-inline: 0; display: flex; justify-content: space-around; align-items: center; z-index: 50; backdrop-filter: blur(12px); }
    .nav-tab { color: var(--muted); font-size: 19px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; padding: 6px 10px; }
    .nav-tab span { font-size: 10px; }
    .nav-tab.active { color: var(--gold); }
    .nav-dot { position: absolute; top: 4px; inset-inline-end: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); display: none; }
    .add-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--grad); color: #0A0B0E; font-size: 20px; display: flex; align-items: center; justify-content: center; margin-top: -15px; box-shadow: 0 4px 14px rgba(200,162,101,.35); }

    /* ---------- stories ---------- */
    .stories-tray { display: flex; gap: 14px; padding: 14px 16px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--card); }
    .stories-tray::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
    .story-ring { width: 62px; height: 62px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, var(--bronze), var(--gold), #FFE4A0); display: flex; align-items: center; justify-content: center; }
    .story-ring.add { background: var(--elev); border: 1px dashed var(--gold); color: var(--gold); }
    .story-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg); }
    .story-name { font-size: 11px; color: var(--muted); max-width: 66px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .feed-tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--card); }
    .feed-tabs button { flex: 1; padding: 11px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
    .feed-tabs button.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }

    /* ---------- posts ---------- */
    .post-card { background: var(--card); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    .post-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 8px; }
    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: start; }
    .avatar-sm { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
    .uname { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .uhandle { font-size: 11px; color: var(--muted); }
    .follow-btn { border: 1px solid var(--gold); color: var(--gold); padding: 4px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    .follow-btn.on { background: var(--elev); color: var(--muted); border-color: var(--line); }
    .post-media-box { background: #000; }
    .post-media { width: 100%; max-height: 520px; object-fit: contain; display: block; margin: auto; }
    .post-actions { display: flex; align-items: center; gap: 18px; padding: 12px 16px 4px; }
    .act-btn { font-size: 20px; display: inline-flex; align-items: center; gap: 6px; }
    .act-btn small { font-size: 12.5px; color: var(--muted); }
    .act-btn.liked { color: var(--danger); }
    .spacer { flex: 1; }
    .post-caption { padding: 4px 16px 14px; font-size: 13.5px; color: #cfd1d6; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .post-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 50px 24px; font-size: 14px; line-height: 1.8; }
    .empty i { font-size: 38px; color: var(--bronze); display: block; margin-bottom: 12px; }
    .skeleton { height: 280px; margin: 8px 0; background: linear-gradient(90deg, var(--card), var(--elev), var(--card)); background-size: 200% 100%; animation: sk 1.3s infinite; }
    @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* ---------- reels ---------- */
    #screen-reels { background: #000; scroll-snap-type: y mandatory; }
    #screen-reels.active { display: block; }
    .reel { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #000; }
    .reel video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reel-overlay { position: absolute; bottom: 20px; inset-inline: 16px 70px; z-index: 5; text-shadow: 0 2px 6px rgba(0,0,0,.9); text-align: start; }
    .reel-overlay h4 { color: var(--gold); font-size: 14px; margin-bottom: 4px; }
    .reel-overlay p { font-size: 13px; line-height: 1.5; }
    .reel-side { position: absolute; bottom: 24px; inset-inline-end: 12px; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .reel-side button { font-size: 25px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
    .reel-side button.liked { color: var(--danger); }
    .reel-side span { font-size: 11.5px; text-shadow: 0 1px 4px #000; margin-top: -12px; }

    /* ---------- chat ---------- */
    #inbox-view, #conv-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #conv-view { display: none; }
    .inbox-list { overflow-y: auto; flex: 1; }
    .conv-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: start; }
    .conv-row:active { background: var(--card); }
    .conv-row .grow { flex: 1; min-width: 0; }
    .conv-last { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: 11px; color: var(--muted); }
    .conv-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--card); }
    .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .message-bubble { max-width: 80%; padding: 9px 13px; border-radius: 16px; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
    .message-bubble.sent { align-self: flex-start; background: linear-gradient(135deg, var(--bronze), var(--gold)); color: #0A0B0E; font-weight: 500; border-end-start-radius: 3px; }
    .message-bubble.received { align-self: flex-end; background: var(--card); border: 1px solid var(--line); border-end-end-radius: 3px; }
    .message-bubble.failed { opacity: .5; outline: 1px solid var(--danger); }
    .msg-time { display: block; font-size: 10px; opacity: .6; margin-top: 3px; }
    .chat-input-bar { padding: 10px 12px; background: var(--card); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .chat-input-bar input { flex: 1; background: var(--elev); border: 1px solid var(--line); border-radius: 22px; padding: 10px 16px; color: #fff; outline: none; font-size: 16px; }

    /* ---------- profile / search ---------- */
    .profile-hero { padding: 22px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
    .avatar-lg { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); padding: 3px; }
    .bio { font-size: 13px; color: #cfd1d6; max-width: 320px; line-height: 1.6; margin-top: 4px; white-space: pre-wrap; }
    .stats-row { display: flex; width: 100%; justify-content: space-around; margin: 16px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
    .stats-row b { font-size: 16px; }
    .stats-row p { font-size: 11px; color: var(--muted); }
    .profile-actions { display: flex; gap: 8px; width: 100%; }
    .profile-actions > * { flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border-top: 1px solid var(--line); }
    .grid-item { aspect-ratio: 1; background: var(--elev); position: relative; overflow: hidden; }
    .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .grid-item i { position: absolute; top: 6px; inset-inline-start: 6px; color: #fff; font-size: 13px; text-shadow: 0 1px 4px #000; }
    .back-row { padding: 8px 10px 0; }
    .search-bar { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; gap: 8px; align-items: center; }
    .search-bar input { flex: 1; }
    .user-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .user-row .user-info { flex: 1; cursor: pointer; }

    /* ---------- sheets / viewer / toast ---------- */
    .overlay { position: absolute; inset: 0; z-index: 150; background: rgba(0,0,0,.82); display: none; align-items: flex-end; backdrop-filter: blur(4px); }
    .overlay.active { display: flex; }
    .sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 18px 24px; border-top: 1px solid var(--gold); display: flex; flex-direction: column; gap: 12px; }
    .sheet-title { color: var(--gold); text-align: center; font-size: 15px; }
    .cm-list { display: flex; flex-direction: column; gap: 14px; max-height: 50vh; overflow-y: auto; }
    .cm { display: flex; gap: 10px; align-items: flex-start; }
    .cm .body { flex: 1; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .cm .body b { color: var(--gold); margin-inline-end: 6px; cursor: pointer; }
    .cm small { display: block; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
    .cm-bar { display: flex; gap: 8px; align-items: center; }
    .preview-box { background: #000; border-radius: 14px; overflow: hidden; max-height: 280px; display: flex; justify-content: center; }
    .preview-box img, .preview-box video { max-height: 280px; object-fit: contain; }
    .reason { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--elev); border-radius: 12px; font-size: 13.5px; width: 100%; text-align: start; }

    #story-viewer { position: absolute; inset: 0; z-index: 250; background: #000; display: none; }
    #story-viewer.active { display: block; }
    .sv-bars { position: absolute; top: 10px; inset-inline: 10px; display: flex; gap: 4px; z-index: 5; }
    .sv-bar { flex: 1; height: 3px; background: rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; }
    .sv-bar i { display: block; height: 100%; width: 0; background: #fff; }
    .sv-bar.done i { width: 100%; }
    .sv-top { position: absolute; top: 22px; inset-inline: 12px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
    .sv-top .user-info { text-shadow: 0 1px 4px #000; }
    .sv-media { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .sv-media img, .sv-media video { width: 100%; height: 100%; object-fit: contain; }
    .sv-zone { position: absolute; top: 70px; bottom: 0; width: 50%; z-index: 4; }
    .sv-zone.l { left: 0; } .sv-zone.r { right: 0; }

    #toasts { position: absolute; top: 70px; inset-inline: 0; z-index: 500; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .toast { background: var(--elev); border: 1px solid var(--gold); color: var(--text); padding: 10px 18px; border-radius: 22px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.6); max-width: 90%; text-align: center; }
    .toast.err { border-color: var(--danger); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">

  <div id="splash"><div class="brand-logo grad-text" style="font-size:38px">LINKUP</div></div>
  <div id="toasts"></div>

  
  <div id="auth-screen">
    <div class="auth-card">
      <div class="grad-text" style="text-align:center;font-size:32px">LINKUP</div>
      <p class="muted" style="text-align:center;font-size:13px" id="auth-subtitle">سجل دخول ونورنا ياملك</p>

      <div class="auth-view" id="auth-main">
        <div class="auth-input-group hidden" id="group-username">
          <label for="auth-username">اسم المستخدم (إنجليزي، أرقام، _ .)</label>
          <input id="auth-username" class="auth-input" placeholder="ziad_mira" autocomplete="username" autocapitalize="none" dir="ltr" maxlength="24">
        </div>
        <div class="auth-input-group">
          <label for="auth-email">البريد الإلكتروني</label>
          <input id="auth-email" type="email" class="auth-input" placeholder="name@gmail.com" autocomplete="email" dir="ltr">
        </div>
        <div class="auth-input-group">
          <div class="row-between">
            <label for="auth-password">كلمة المرور</label>
            <button type="button" class="link-btn" id="forgot-btn" data-action="forgot">هل نسيت كلمة المرور؟</button>
          </div>
          <input id="auth-password" type="password" class="auth-input" placeholder="••••••••" autocomplete="current-password" data-enter="auth-submit" dir="ltr">
        </div>
        <button class="gold-btn" id="auth-submit-btn" data-action="auth-submit">تسجيل الدخول</button>
        <div class="divider">أو</div>
        <button type="button" class="google-btn" data-action="google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.58c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29A11.99 11.99 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l3.98-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
          </svg>
          المتابعة باستخدام Google
        </button>
        <button type="button" class="ghost-btn gold" data-action="toggle-mode"><i class="fa-solid fa-user-plus"></i><span id="switch-text">ليس لديك حساب؟ أنشئ حساباً الآن</span></button>
      </div>

      <div class="auth-view hidden" id="auth-otp">
        <p style="font-size:13px;text-align:center;color:var(--gold)" id="otp-hint"></p>
        <input id="otp-input" class="auth-input otp-input" inputmode="numeric" maxlength="8" placeholder="000000" autocomplete="one-time-code" data-enter="verify-otp" dir="ltr">
        <button class="gold-btn" data-action="verify-otp">تأكيد الرمز</button>
        <button class="link-btn" id="resend-btn" data-action="resend-otp" style="text-align:center">إعادة إرسال الكود</button>
        <button class="link-btn" data-action="auth-back" style="text-align:center">رجوع</button>
      </div>

      <div class="auth-view hidden" id="auth-forgot">
        <p style="font-size:13px;text-align:center;color:var(--gold)">اكتب إيميلك وهنبعتلك كود لإعادة تعيين كلمة المرور</p>
        <input id="forgot-email" type="email" class="auth-input" placeholder="name@gmail.com" data-enter="send-reset" dir="ltr">
        <button class="gold-btn" data-action="send-reset">إرسال الكود</button>
        <button class="link-btn" data-action="auth-back" style="text-align:center">رجوع لتسجيل الدخول</button>
      </div>

      <div class="auth-view hidden" id="auth-newpass">
        <p style="font-size:13px;text-align:center;color:var(--gold)">اكتب كلمة المرور الجديدة</p>
        <input id="newpass-input" type="password" class="auth-input" placeholder="8 حروف على الأقل" autocomplete="new-password" data-enter="set-password" dir="ltr">
        <button class="gold-btn" data-action="set-password">حفظ ودخول</button>
      </div>
    </div>
  </div>

  
  <header class="top-header">
    <div class="brand-logo grad-text" data-action="refresh" style="cursor:pointer">LINKUP</div>
    <div class="header-actions">
      <button class="icon-btn" data-action="open-search" aria-label="بحث"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" data-action="logout" aria-label="تسجيل الخروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <main class="main-viewport">
    <section id="screen-home" class="screen active">
      <div class="stories-tray" id="stories-tray"></div>
      <div class="feed-tabs">

<script>

const SUPABASE_URL = "https://dnanckdyglezgjaxksey.supabase.co";
const SUPABASE_KEY = "sb_publishable_7hUZqoIEYPf2EPtmtMjzVw_RboLexpp";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '';
const dn = u => (u && (u.full_name || u.username)) || 'مستخدم';
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? (n/1e3).toFixed(1) + 'K' : String(n);
const toast = (msg, type) => { const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => t.remove(), 3200); };
function av(u) {
  if (u && /^https?:\/\//i.test(u.avatar_url || '')) return esc(u.avatar_url);
  const ch = ((u && (u.full_name || u.username)) || '?').trim().charAt(0).toUpperCase().replace(/[<>&'"]/g, '') || '?';
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='#1B1E26'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='56' fill='#C8A265'>${ch}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return 'الآن';
  if (s < 3600) return `منذ ${Math.floor(s/60)} د`;
  if (s < 86400) return `منذ ${Math.floor(s/3600)} س`;
  if (s < 604800) return `منذ ${Math.floor(s/86400)} يوم`;
  return new Date(t).toLocaleDateString('ar-EG');
}
const hhmm = t => new Date(t).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
function errMsg(e) {
  const m = (e && e.message) || String(e || '');
  if (/invalid login/i.test(m)) return 'الإيميل أو كلمة المرور غلط';
  if (/already registered/i.test(m)) return 'الإيميل ده مسجل قبل كده';
  if (/expired|invalid/i.test(m) && /token|otp|code/i.test(m)) return 'الكود غلط أو انتهت صلاحيته';
  if (/rate limit|too many|after \d+ seconds/i.test(m)) return 'محاولات كتير، استنى شوية وجرب تاني';
  if (/password/i.test(m) && /least|short|weak/i.test(m)) return 'كلمة المرور ضعيفة';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'مشكلة في الاتصال بالإنترنت';
  return 'حصل خطأ: ' + m;
}
const emptyBox = (icon, text) => `<div class="empty"><i class="${icon}"></i>${text}</div>`;
async function busy(el, fn) {
  if (el && el.disabled) return;
  if (el) el.disabled = true;
  try { await fn(); } finally { if (el) el.disabled = false; }
}

const S = {
  user: null, profile: null, tab: 'home', recovering: false,
  feedMode: 'all', feedPage: 0, feedEnd: false, feedLoading: false,
  followingIds: new Set(), likedIds: new Set(),
  storyGroups: [], inbox: [], activeConv: null, dmChannel: null,
  muted: true, pending: null, previewUrl: null, profileBack: 'home', viewProfileId: null,
  reelObs: null, feedObs: null, sv: null
};
const PAGE = 15;

let authMode = 'login', otpEmail = '', otpMode = 'signup';
function showAuth(view) {
  $('splash').style.display = 'none';
  $('auth-screen').style.display = 'flex';
  ['auth-main', 'auth-otp', 'auth-forgot', 'auth-newpass'].forEach(id => $(id).classList.toggle('hidden', id !== view));
}
function hideAuth() { $('splash').style.display = 'none'; $('auth-screen').style.display = 'none'; }

function toggleMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  const reg = authMode === 'register';
  $('group-username').classList.toggle('hidden', !reg);
  $('forgot-btn').classList.toggle('hidden', reg);
  $('auth-password').autocomplete = reg ? 'new-password' : 'current-password';
  $('auth-submit-btn').textContent = reg ? 'إنشاء الحساب وإرسال الكود' : 'تسجيل الدخول';
  $('auth-subtitle').textContent = reg ? 'انضم لمجتمع LinkUp واستلم كود التفعيل على إيميلك' : 'سجّل دخولك لمجتمع الفخامة والخصوصية';
  $('switch-text').textContent = reg ? 'عندك حساب؟ سجّل دخولك' : 'ليس لديك حساب؟ أنشئ حساباً الآن';
}
function showOtp(email, mode) {
  otpEmail = email; otpMode = mode;
  $('otp-hint').textContent = (mode === 'recovery' ? 'بعتنا كود استعادة كلمة المرور إلى ' : 'بعتنا كود التفعيل إلى ') + email + '. اكتبه هنا:';
  $('otp-input').value = '';
  showAuth('auth-otp');
}
async function authSubmit(btn) {
  const email = $('auth-email').value.trim().toLowerCase();
  const pw = $('auth-password').value;
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('اكتب إيميل صحيح', 'err');
  await busy(btn, async () => {
    if (authMode === 'register') {
      const username = $('auth-username').value.trim().toLowerCase();
      if (!/^[a-z0-9_.]{3,24}$/.test(username)) return toast('اسم المستخدم: 3 إلى 24 حرف إنجليزي أو أرقام أو _ .', 'err');
      if (pw.length < 8) return toast('كلمة المرور لازم 8 حروف على الأقل', 'err');
      const chk = await sb.rpc('username_available', { u: username });
      if (chk.data === false) return toast('اسم المستخدم ده متاخد، جرب غيره', 'err');
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { username, full_name: username } } });
      if (error) return toast(errMsg(error), 'err');
      if (data.user && data.user.identities && data.user.identities.length === 0) return toast('الإيميل ده مسجل قبل كده، سجّل دخول', 'err');
      if (data.session) return;
      showOtp(email, 'signup');
    } else {
      if (!pw) return toast('اكتب كلمة المرور', 'err');
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await sb.auth.resend({ type: 'signup', email });
          showOtp(email, 'signup');
          return toast('الإيميل لسه مش مفعّل، بعتنالك كود جديد');
        }
        return toast(errMsg(error), 'err');
      }
    }
  });
}
async function signInGoogle() {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
  if (error) toast('Google مش متفعّل لسه في Supabase: ' + error.message, 'err');
}
async function sendReset(btn) {
  const email = $('forgot-email').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('اكتب إيميل صحيح', 'err');
  await busy(btn, async () => {
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if (error) return toast(errMsg(error), 'err');
    showOtp(email, 'recovery');
  });
}
async function verifyOtp(btn) {
  const token = $('otp-input').value.trim();
  if (token.length < 6) return toast('اكتب الكود كامل', 'err');
  await busy(btn, async () => {
    if (otpMode === 'recovery') {
      S.recovering = true;
      const { error } = await sb.auth.verifyOtp({ email: otpEmail, token, type: 'recovery' });
      if (error) { S.recovering = false; return toast(errMsg(error), 'err'); }
      showAuth('auth-newpass');
    } else {
      let r = await sb.auth.verifyOtp({ email: otpEmail, token, type: 'email' });
      if (r.error) r = await sb.auth.verifyOtp({ email: otpEmail, token, type: 'signup' });
      if (r.error) return toast(errMsg(r.error), 'err');
      toast('تم تفعيل حسابك، أهلاً بيك في LinkUp');
    }
  });
}
async function resendOtp(btn) {
  await busy(btn, async () => {
    const r = otpMode === 'recovery' ? await sb.auth.resetPasswordForEmail(otpEmail) : await sb.auth.resend({ type: 'signup', email: otpEmail });
    toast(r.error ? errMsg(r.error) : 'بعتنا كود جديد', r.error ? 'err' : '');
  });
}
async function setPassword(btn) {
  const pw = $('newpass-input').value;
  if (pw.length < 8) return toast('كلمة المرور لازم 8 حروف على الأقل', 'err');
  await busy(btn, async () => {
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) return toast(errMsg(error), 'err');
    toast('تم تغيير كلمة المرور');
    S.recovering = false;
    const { data } = await sb.auth.getSession();
    if (data.session) boot(data.session);
  });
}

sb.auth.onAuthStateChange((event, session) => {
  // مهم: ماننديش أي طلب Supabase جوه الـ callback مباشرة (بيعمل deadlock) فبنأجله
  setTimeout(() => {
    if (event === 'PASSWORD_RECOVERY') { S.recovering = true; showAuth('auth-newpass'); return; }
    if (S.recovering) return;
    if (session && session.user) boot(session);
    else if (event === 'INITIAL_SESSION' || event === 'SIGNED_OUT') { teardown(); showAuth('auth-main'); }
  }, 0);
});

/* =====================================================================
   BOOT / TEARDOWN
   ===================================================================== */
async function boot(session) {
  if (S.user && S.user.id === session.user.id) { hideAuth(); return; }
  S.user = session.user;
  hideAuth();
  await loadMyProfile();
  await loadFollowing();
  switchTab('home');
  loadFeed(true); loadStories(); loadInbox(); subscribeDMs(); setupFeedObserver();
}
function teardown() {
  if (S.dmChannel) { sb.removeChannel(S.dmChannel); S.dmChannel = null; }
  if (S.reelObs) S.reelObs.disconnect();
  closeStory();
  Object.assign(S, { user: null, profile: null, activeConv: null, inbox: [], storyGroups: [], viewProfileId: null, feedPage: 0, feedEnd: false });
  S.followingIds.clear(); S.likedIds.clear();
  ['posts-feed', 'stories-tray', 'inbox-list', 'chat-messages', 'profile-content', 'search-results'].forEach(id => { const e = $(id); if (e) e.innerHTML = ''; });
  $('screen-reels').innerHTML = '';
  $('chat-dot').style.display = 'none';
  closeSheet();
}
async function loadMyProfile() {
  let { data } = await sb.from('profiles').select('id,username,full_name,avatar_url,bio').eq('id', S.user.id).maybeSingle();
  if (!data) {
    const base = ((S.user.email || 'user').split('@')[0].toLowerCase().replace(/[^a-z0-9_.]/g, '') + 'user').slice(0, 14);
    const uname = base + Math.floor(Math.random() * 9000 + 1000);
    const r = await sb.from('profiles').insert({ id: S.user.id, username: uname, full_name: uname }).select().single();
    data = r.data;
  }
  S.profile = data;
}
async function loadFollowing() {
  const { data } = await sb.from('follows').select('following_id').eq('follower_id', S.user.id);
  S.followingIds = new Set((data || []).map(r => r.following_id));
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function switchTab(name, opts) {
  S.tab = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name && !(opts && opts.noHighlight)));
  if (name !== 'reels') document.querySelectorAll('#screen-reels video').forEach(v => v.pause());
  if (name === 'reels') { if (!$('screen-reels').children.length) loadReels(); else playVisibleReel(); }
  if (name === 'chat') { $('chat-dot').style.display = 'none'; if (S.activeConv) openConvView(); else loadInbox(); }
}

/* =====================================================================
   POSTS & FEED
   ===================================================================== */
function mediaHtml(p) {
  const url = safeUrl(p.media_url);
  return p.media_type === 'video'
    ? `<video class="post-media" src="${url}" controls playsinline preload="metadata"></video>`
    : `<img class="post-media" src="${url}" loading="lazy" alt="">`;
}
function postCard(p) {
  const u = p.profiles || {};
  const likes = (p.likes && p.likes[0] && p.likes[0].count) || 0;
  const comments = (p.comments && p.comments[0] && p.comments[0].count) || 0;
  const liked = S.likedIds.has(p.id), mine = p.user_id === S.user.id;
  const following = S.followingIds.has(p.user_id);
  return `
  <article class="post-card" data-post="${p.id}">
    <div class="post-head">
      <button class="user-info" data-action="open-profile" data-id="${p.user_id}">
        <img class="avatar-sm" src="${av(u)}" alt="">
        <div><div class="uname">${esc(dn(u))}</div><div class="uhandle">@${esc(u.username)} · ${ago(p.created_at)}</div></div>
      </button>
      ${mine ? '' : `<button class="follow-btn ${following ? 'on' : ''}" data-action="follow" data-follow="${p.user_id}" data-id="${p.user_id}">${following ? 'بتتابعه' : '+ متابعة'}</button>`}
    </div>
    <div class="post-media-box" data-dbl="${p.id}">${mediaHtml(p)}</div>
    <div class="post-actions">
      <button class="act-btn ${liked ? 'liked' : ''}" data-action="like" data-like="${p.id}" data-id="${p.id}"><i class="${liked ? 'fa-solid' : 'fa-regular'} fa-heart"></i><small data-like-count="${p.id}" data-n="${likes}">${fmt(likes)}</small></button>
      <button class="act-btn" data-action="comments" data-id="${p.id}"><i class="fa-regular fa-comment"></i><small data-comment-count="${p.id}" data-n="${comments}">${fmt(comments)}</small></button>
      <span class="spacer"></span>
      ${mine ? `<button class="act-btn" data-action="delete-post" data-id="${p.id}" aria-label="حذف"><i class="fa-regular fa-trash-can"></i></button>`
             : `<button class="act-btn" data-action="report" data-id="${p.id}" aria-label="إبلاغ"><i class="fa-regular fa-flag"></i></button>`}
    </div>
    ${p.caption ? `<div class="post-caption"><b>${esc(u.username)}</b> ${esc(p.caption)}</div>` : ''}
  </article>`;
}
const POST_SELECT = 'id,caption,media_url,media_type,is_reel,created_at,user_id,profiles:user_id(id,username,full_name,avatar_url),likes(count),comments(count)';
async function markLiked(ids) {
  if (!ids.length) return;
  const { data } = await sb.from('likes').select('post_id').eq('user_id', S.user.id).in('post_id', ids);
  (data || []).forEach(r => S.likedIds.add(r.post_id));
}
async function loadFeed(reset) {
  if (S.feedLoading || (!reset && S.feedEnd)) return;
  S.feedLoading = true;
  const box = $('posts-feed');
  if (reset) { S.feedPage = 0; S.feedEnd = false; box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>'; }
  let q = sb.from('posts').select(POST_SELECT).eq('is_reel', false).order('created_at', { ascending: false })
    .range(S.feedPage * PAGE, S.feedPage * PAGE + PAGE - 1);
  if (S.feedMode === 'following') q = q.in('user_id', [...S.followingIds, S.user.id]);
  const { data, error } = await q;
  if (reset) box.innerHTML = '';
  if (error) { S.feedLoading = false; if (reset) box.innerHTML = emptyBox('fa-solid fa-triangle-exclamation', 'مقدرناش نحمّل البوستات. اتأكد إنك شغّلت schema.sql وجرب تاني.'); return; }
  await markLiked(data.map(p => p.id));
  box.insertAdjacentHTML('beforeend', data.map(postCard).join(''));
  if (data.length < PAGE) S.feedEnd = true;
  S.feedPage++;
  if (reset && !data.length) box.innerHTML = emptyBox('fa-regular fa-image', S.feedMode === 'following' ? 'تابع ناس عشان تشوف بوستاتهم هنا.' : 'لسه مفيش بوستات. كن أول واحد ينشر!');
  S.feedLoading = false;
}
function setupFeedObserver() {
  if (S.feedObs) S.feedObs.disconnect();
  S.feedObs = new IntersectionObserver(es => { if (es[0].isIntersecting && S.tab === 'home') loadFeed(false); }, { root: $('screen-home'), rootMargin: '400px' });
  S.feedObs.observe($('feed-sentinel'));
}

/* ---------- like / follow ---------- */
function setLikeUI(id, on, delta) {
  on ? S.likedIds.add(id) : S.likedIds.delete(id);
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b => { b.classList.toggle('liked', on); const i = b.querySelector('i'); if (i) i.className = (on ? 'fa-solid' : 'fa-regular') + ' fa-heart'; });
  document.querySelectorAll(`[data-like-count="${id}"]`).forEach(s => { const n = Math.max(0, (+s.dataset.n || 0) + delta); s.dataset.n = n; s.textContent = fmt(n); });
}
async function toggleLike(id) {
  const was = S.likedIds.has(id);
  setLikeUI(id, !was, was ? -1 : 1);
  const r = was ? await sb.from('likes').delete().eq('post_id', id).eq('user_id', S.user.id)
                : await sb.from('likes').insert({ post_id: id, user_id: S.user.id });
  if (r.error && r.error.code !== '23505') { setLikeUI(id, was, was ? 1 : -1); toast('مقدرناش نسجّل الإعجاب', 'err'); }
}
function setFollowUI(uid, on) {
  on ? S.followingIds.add(uid) : S.followingIds.delete(uid);
  document.querySelectorAll(`[data-follow="${uid}"]`).forEach(b => { b.textContent = on ? 'بتتابعه' : '+ متابعة'; b.classList.toggle('on', on); });
  if (S.viewProfileId === uid && $('stat-followers')) { const e = $('stat-followers'); e.textContent = Math.max(0, (+e.textContent || 0) + (on ? 1 : -1)); }
}
async function toggleFollow(uid) {
  if (uid === S.user.id) return;
  const was = S.followingIds.has(uid);
  setFollowUI(uid, !was);
  const r = was ? await sb.from('follows').delete().eq('follower_id', S.user.id).eq('following_id', uid)
                : await sb.from('follows').insert({ follower_id: S.user.id, following_id: uid });
  if (r.error && r.error.code !== '23505') { setFollowUI(uid, was); toast('حصل خطأ، جرب تاني', 'err'); }
}

/* ---------- delete / report ---------- */
async function deletePost(id) {
  if (!confirm('متأكد إنك عايز تمسح المنشور ده؟')) return;
  const { data: post } = await sb.from('posts').select('media_url').eq('id', id).maybeSingle();
  const { error } = await sb.from('posts').delete().eq('id', id).eq('user_id', S.user.id);
  if (error) return toast('مقدرناش نمسح المنشور', 'err');
  removeStorage('posts', post && post.media_url);
  document.querySelectorAll(`[data-post="${id}"], [data-reel="${id}"]`).forEach(e => e.remove());
  closeSheet(); toast('تم الحذف');
  if (S.viewProfileId === S.user.id && S.tab === 'profile') showProfile(S.user.id);
}
function removeStorage(bucket, url) {
  const marker = `/storage/v1/object/public/${bucket}/`;
  const i = (url || '').indexOf(marker);
  if (i >= 0) sb.storage.from(bucket).remove([decodeURIComponent(url.slice(i + marker.length))]).catch(() => {});
}
function openReport(postId) {
  const reasons = ['محتوى مسيء أو كراهية', 'عنف أو إيذاء', 'محتوى جنسي', 'احتيال أو سبام', 'انتهاك حقوق ملكية', 'سبب تاني'];
  openSheet(`<h4 class="sheet-title">إبلاغ عن المنشور</h4>` + reasons.map(r => `<button class="reason" data-action="send-report" data-id="${postId}" data-reason="${esc(r)}"><i class="fa-regular fa-flag" style="color:var(--gold)"></i>${esc(r)}</button>`).join(''));
}
async function sendReport(el) {
  await busy(el, async () => {
    const { error } = await sb.from('reports').insert({ reporter_id: S.user.id, post_id: el.dataset.id, reason: el.dataset.reason });
    closeSheet();

function bumpComments(postId, d) {

async function sendComment(el) {

async function loadReels() {
  const box = $('screen-reels');
  box.innerHTML = emptyBox('fa-solid fa-spinner fa-spin', 'جاري التحميل...');
  const { data, error } = await sb.from('posts').select(POST_SELECT).eq('is_reel', true).order('created_at', { ascending: false }).limit(25);
  if (error || !data.length) { box.innerHTML = emptyBox('fa-solid fa-film', error ? 'مقدرناش نحمّل الريلز' : 'مفيش ريلز لسه. ارفع أول فيديو!'); return; }
  await markLiked(data.map(p => p.id));
  box.innerHTML = data.map(reelItem).join('');
  observeReels();
}
function reelItem(r) {
  const u = r.profiles || {}, mine = r.user_id === S.user.id, liked = S.likedIds.has(r.id);
  const likes = (r.likes && r.likes[0] && r.likes[0].count) || 0, cms = (r.comments && r.comments[0] && r.comments[0].count) || 0;
  return `<div class="reel" data-reel="${r.id}">
    <video src="${safeUrl(r.media_url)}" loop playsinline muted preload="metadata" data-action="reel-toggle"></video>
    <div class="reel-side">
      <button class="${liked ? 'liked' : ''}" data-action="like" data-like="${r.id}" data-id="${r.id}"><i class="${liked ? 'fa-solid' : 'fa-regular'} fa-heart"></i></button>
      <span data-like-count="${r.id}" data-n="${likes}">${fmt(likes)}</span>
      <button data-action="comments" data-id="${r.id}"><i class="fa-regular fa-comment"></i></button>
      <span data-comment-count="${r.id}" data-n="${cms}">${fmt(cms)}</span>
      <button data-action="sound"><i class="fa-solid ${S.muted ? 'fa-volume-xmark' : 'fa-volume-high'}" data-sound-icon></i></button>
      ${mine ? `<button data-action="delete-post" data-id="${r.id}"><i class="fa-regular fa-trash-can"></i></button>` : `<button data-action="report" data-id="${r.id}"><i class="fa-regular fa-flag"></i></button>`}
    </div>
    <div class="reel-overlay"><h4 data-action="open-profile" data-id="${r.user_id}" style="cursor:pointer">@${esc(u.username)}</h4><p>${esc(r.caption || '')}</p></div>
  </div>`;
}
function observeReels() {
  if (S.reelObs) S.reelObs.disconnect();
  S.reelObs = new IntersectionObserver(es => es.forEach(en => {
    const v = en.target.querySelector('video'); if (!v) return;
    if (en.isIntersecting && en.intersectionRatio >= 0.7 && S.tab === 'reels') { v.muted = S.muted; v.play().catch(() => {}); }
    else v.pause();
  }), { root: $('screen-reels'), threshold: [0, 0.7, 1] });
  document.querySelectorAll('.reel').forEach(r => S.reelObs.observe(r));
}
function playVisibleReel() {
  const sc = $('screen-reels'); if (!sc.clientHeight) return;
  const idx = Math.round(sc.scrollTop / sc.clientHeight);
  const v = sc.querySelectorAll('.reel video')[idx];
  if (v) { v.muted = S.muted; v.play().catch(() => {}); }
}
function toggleSound() {
  S.muted = !S.muted;
  document.querySelectorAll('#screen-reels video').forEach(v => v.muted = S.muted);
  document.querySelectorAll('[data-sound-icon]').forEach(i => i.className = 'fa-solid ' + (S.muted ? 'fa-volume-xmark' : 'fa-volume-high'));
}

async function loadStories() {
  const since = new Date(Date.now() - 864e5).toISOString();
  const { data } = await sb.from('stories').select('id,user_id,media_url,media_type,created_at,profiles:user_id(id,username,full_name,avatar_url)')
    .gt('created_at', since).order('created_at', { ascending: true });
  const map = new Map();
  (data || []).forEach(s => { if (!map.has(s.user_id)) map.set(s.user_id, { uid: s.user_id, profile: s.profiles, items: [] }); map.get(s.user_id).items.push(s); });
  const groups = [...map.values()].sort((a, b) => {
    if (a.uid === S.user.id) return -1; if (b.uid === S.user.id) return 1;
    return new Date(b.items[b.items.length - 1].created_at) - new Date(a.items[a.items.length - 1].created_at);
  });
  S.storyGroups = groups;
  $('stories-tray').innerHTML = `<button class="story-item" data-action="story-add"><div class="story-ring add"><i class="fa-solid fa-plus"></i></div><span class="story-name">قصتك</span></button>` +
    groups.map((g, i) => `<button class="story-item" data-action="story-open" data-i="${i}"><div class="story-ring"><img src="${av(g.profile)}" alt=""></div><span class="story-name">${g.uid === S.user.id ? 'قصتي' : esc(g.profile && g.profile.username)}</span></button>`).join('');
}
function openStory(gi) {
  const g = S.storyGroups[gi]; if (!g) return;
  S.sv = { gi, ii: 0, timer: null };
  $('story-viewer').classList.add('active');
  renderStoryItem();
}
function renderStoryItem() {
  const sv = S.sv; if (!sv) return;
  clearTimeout(sv.timer);
  const g = S.storyGroups[sv.gi], it = g.items[sv.ii], url = safeUrl(it.media_url);
  const mine = g.uid === S.user.id;
  $('story-viewer').innerHTML = `
    <div class="sv-bars">${g.items.map((_, i) => `<div class="sv-bar ${i < sv.ii ? 'done' : ''}"><i></i></div>`).join('')}</div>
    <div class="sv-top">
      <button class="user-info" data-action="story-profile" data-id="${g.uid}"><img class="avatar-sm" src="${av(g.profile)}" alt=""><div><div class="uname">${esc(dn(g.profile))}</div><div class="uhandle" style="color:#ddd">${ago(it.created_at)}</div></div></button>
      <div>${mine ? '<button class="icon-btn" style="color:#fff" data-action="story-delete" aria-label="حذف"><i class="fa-regular fa-trash-can"></i></button>' : ''}<button class="icon-btn" style="color:#fff" data-action="story-close" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
    </div>
    <div class="sv-media">${it.media_type === 'video' ? `<video src="${url}" playsinline autoplay></video>` : `<img src="${url}" alt="">`}</div>
    <div class="sv-zone l" data-action="story-next"></div><div class="sv-zone r" data-action="story-prev"></div>`;
  const bar = document.querySelectorAll('.sv-bar')[sv.ii].firstElementChild;
  const run = sec => { bar.style.transition = `width ${sec}s linear`; requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '100%'; })); sv.timer = setTimeout(nextStory, sec * 1000); };
  if (it.media_type === 'video') {
    const v = document.querySelector('#story-viewer video');
    v.addEventListener('loadedmetadata', () => { clearTimeout(sv.timer); run(Math.min(v.duration || 10, 30)); }, { once: true });
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    sv.timer = setTimeout(() => run(8), 4000);
  } else run(5);
}
function nextStory() {
  const sv = S.sv; if (!sv) return;
  const g = S.storyGroups[sv.gi];
  if (sv.ii < g.items.length - 1) { sv.ii++; renderStoryItem(); }
  else if (sv.gi < S.storyGroups.length - 1) { sv.gi++; sv.ii = 0; renderStoryItem(); }
  else closeStory();
}
function prevStory() {
  const sv = S.sv; if (!sv) return;
  if (sv.ii > 0) { sv.ii--; renderStoryItem(); }
  else if (sv.gi > 0) { sv.gi--; sv.ii = 0; renderStoryItem(); }
  else renderStoryItem();
}
function closeStory() {
  if (S.sv) clearTimeout(S.sv.timer);
  S.sv = null;
  const v = $('story-viewer'); v.classList.remove('active'); v.innerHTML = '';
}
async function deleteStory() {
  const sv = S.sv; if (!sv || !confirm('تمسح القصة دي؟')) return;
  const it = S.storyGroups[sv.gi].items[sv.ii];
  const { error } = await sb.from('stories').delete().eq('id', it.id).eq('user_id', S.user.id);
  if (error) return toast('مقدرناش نمسح القصة', 'err');
  removeStorage('posts', it.media_url);
  closeStory(); loadStories(); toast('تم حذف القصة');
}

const LIMIT = { image: 10 * 1024 * 1024, video: 50 * 1024 * 1024 };
function openCreate() {
  openSheet(`<h4 class="sheet-title">محتوى جديد</h4>
    <button class="ghost-btn" data-action="pick" data-kind="post"><i class="fa-regular fa-image" style="color:var(--gold)"></i> منشور (صورة أو فيديو)</button>

function pickFile(kind) {
  S.pending = { kind };
  const fi = $('file-input');
  fi.accept = kind === 'reel' ? 'video/mp4,video/webm,video/quicktime' : kind === 'story' ? 'image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime' : 'image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime';
  fi.value = '';
  fi.click();
}
async function uploadFile(bucket, file) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
  const path = `${S.user.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { contentType: file.type, cacheControl: '3600' });
  if (error) throw error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
function onFileChosen(file) {
  if (!file || !S.pending) return;
  const isVideo = file.type.startsWith('video/'), isImage = file.type.startsWith('image/');
  if (!isVideo && !isImage) return toast('نوع الملف مش مدعوم', 'err');
  if (S.pending.kind === 'reel' && !isVideo) return toast('الريل لازم يكون فيديو', 'err');
  if (file.size > LIMIT[isVideo ? 'video' : 'image']) return toast(`الملف كبير. الحد الأقصى ${isVideo ? '50' : '10'} ميجا`, 'err');
  S.pending.file = file; S.pending.type = isVideo ? 'video' : 'image';
  if (S.previewUrl) URL.revokeObjectURL(S.previewUrl);
  S.previewUrl = URL.createObjectURL(file);
  const media = isVideo ? `<video src="${S.previewUrl}" controls playsinline muted></video>` : `<img src="${S.previewUrl}" alt="">`;
  const isStory = S.pending.kind === 'story';
  openSheet(`<h4 class="sheet-title">${isStory ? 'قصة جديدة' : S.pending.kind === 'reel' ? 'ريل جديد' : 'منشور جديد'}</h4>
    <div class="preview-box">${media}</div>
    ${isStory ? '' : '<textarea id="caption-input" class="auth-input" maxlength="500" placeholder="اكتب وصف..."></textarea>'}
    <button class="gold-btn" id="publish-btn" data-action="publish">نشر</button>`);
}
async function publish(btn) {
  const p = S.pending; if (!p || !p.file) return;
  await busy(btn, async () => {
    btn.textContent = 'جاري الرفع... متقفلش الصفحة';
    let url = null;
    try {
      url = await uploadFile('posts', p.file);
      if (p.kind === 'story') {
        const { error } = await sb.from('stories').insert({ user_id: S.user.id, media_url: url, media_type: p.type });
        if (error) throw error;
      } else {
        const caption = ($('caption-input').value || '').trim().slice(0, 500) || null;
        const { error } = await sb.from('posts').insert({ user_id: S.user.id, caption, media_url: url, media_type: p.type, is_reel: p.kind === 'reel' });
        if (error) throw error;
      }
    } catch (e) {
      if (url) removeStorage('posts', url);
      btn.textContent = 'نشر';
      return toast('فشل النشر: ' + (e.message || e), 'err');
    }
    closeSheet(); toast('تم النشر بنجاح');
    const kind = p.kind; S.pending = null;
    if (kind === 'story') loadStories();
    else if (kind === 'reel') { $('screen-reels').innerHTML = ''; switchTab('reels'); }
    else { switchTab('home'); loadFeed(true); }
  });
}

    S.inbox.length ? S.inbox.map(c => `<button class="conv-row" data-action="open-conv" data-id="${c.conversation_id}">
      <img class="avatar-sm" style="width:46px;height:46px" src="${av(c)}" alt="">
      <div class="grow"><div class="uname">${esc(dn(c))}</div><div class="conv-last">${esc(c.last_content || 'ابدأ المحادثة')}</div></div>
      <div class="conv-time">${c.last_content ? ago(c.last_at) : ''}</div></button>`).join('')
    : emptyBox('fa-regular fa-comments', 'مفيش محادثات لسه.<br>ادخل على بروفايل أي حد واضغط «رسالة».');
}
function subscribeDMs() {
  if (S.dmChannel) sb.removeChannel(S.dmChannel);
  S.dmChannel = sb.channel('dm-' + S.user.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_messages' }, payload => {
      const m = payload.new;
      if (m.sender_id === S.user.id) return;
      if (S.activeConv && m.conversation_id === S.activeConv.id && S.tab === 'chat') appendMsg(m, false);
      else $('chat-dot').style.display = 'block';
      if (S.tab === 'chat' && !S.activeConv) loadInbox();
    }).subscribe();
}
function convHead(o) {
  return `<button class="icon-btn" data-action="conv-back" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
    <button class="user-info" data-action="open-profile" data-id="${o.id}"><img class="avatar-sm" src="${av(o)}" alt=""><div><div class="uname">${esc(dn(o))}</div><div class="uhandle">@${esc(o.username)}</div></div></button>`;
}
function openConvView() {
  const c = S.activeConv;
  $('inbox-view').style.display = 'none'; $('conv-view').style.display = 'flex';
  $('conv-head').innerHTML = convHead(c.other);
}
async function openConversation(id, other) {
  S.activeConv = { id, other };
  switchTab('chat');
  openConvView();
  const box = $('chat-messages'); box.innerHTML = '<div class="center muted">جاري التحميل...</div>';
  const { data, error } = await sb.from('dm_messages').select('id,sender_id,content,created_at').eq('conversation_id', id).order('created_at', { ascending: false }).limit(60);
  box.innerHTML = '';
  if (error) { box.innerHTML = '<div class="center muted">مقدرناش نحمّل الرسائل</div>'; return; }
  data.reverse().forEach(m => appendMsg(m, m.sender_id === S.user.id));
  if (!data.length) box.innerHTML = '<div class="center muted" id="chat-empty">قول أهلاً 👋</div>';
}
function appendMsg(m, mine) {
  const box = $('chat-messages');
  const empty = $('chat-empty'); if (empty) empty.remove();
  const b = document.createElement('div');
  b.className = 'message-bubble ' + (mine ? 'sent' : 'received');
  b.textContent = m.content;
  const t = document.createElement('span'); t.className = 'msg-time'; t.textContent = hhmm(m.created_at);
  b.appendChild(t);
  box.appendChild(b);
  box.scrollTop = box.scrollHeight;
  return b;
}
async function sendMsg() {
  const input = $('chat-input'); const text = input.value.trim();
  if (!text || !S.activeConv) return;
  input.value = '';
  const el = appendMsg({ content: text, created_at: new Date().toISOString() }, true);
  const { error } = await sb.from('dm_messages').insert({ conversation_id: S.activeConv.id, sender_id: S.user.id, content: text });
  if (error) { el.classList.add('failed'); toast('الرسالة ماتبعتتش', 'err'); }
}
async function messageUser(uid, btn) {
  await busy(btn, async () => {
    const { data: cid, error } = await sb.rpc('get_or_create_dm', { other: uid });
    if (error) return toast('مقدرناش نفتح المحادثة', 'err');
    const { data: other } = await sb.from('profiles').select('id,username,full_name,avatar_url').eq('id', uid).maybeSingle();
    openConversation(cid, other || { id: uid, username: '' });
  });
}

/* =====================================================================
   SHEET
   ===================================================================== */
function openSheet(html) { $('sheet-body').innerHTML = html; $('sheet').classList.add('active'); }
function closeSheet() {
  $('sheet').classList.remove('active'); $('sheet-body').innerHTML = '';
  if (S.previewUrl) { URL.revokeObjectURL(S.previewUrl); S.previewUrl = null; }
}

/* =====================================================================
   EVENTS (delegation)
   ===================================================================== */
const actions = {
  'tab': el => { const t = el.dataset.tab; if (t === 'profile') showProfile(S.user.id); else { if (t === 'chat') S.activeConv = null; switchTab(t); } },
  'refresh': () => { if (S.tab === 'home') { loadFeed(true); loadStories(); } else if (S.tab === 'reels') { $('screen-reels').innerHTML = ''; loadReels(); } },
  'logout': async () => { if (confirm('تسجيل الخروج؟')) await sb.auth.signOut(); },
  'open-search': () => { switchTab('search', { noHighlight: true }); $('search-input').focus(); runSearch($('search-input').value); },
  'search-close': () => switchTab('home'),
  'feed-mode': el => { S.feedMode = el.dataset.mode; document.querySelectorAll('.feed-tabs button').forEach(b => b.classList.toggle('active', b === el)); loadFeed(true); },
  'like': el => toggleLike(el.dataset.id),
  'follow': el => toggleFollow(el.dataset.id),
  'comments': el => openComments(el.dataset.id),
  'send-comment': el => sendComment(el),
  'del-comment': el => delComment(el),
  'delete-post': el => deletePost(el.dataset.id),
  'report': el => openReport(el.dataset.id),
  'send-report': el => sendReport(el),
  'open-profile': el => { if (S.sv) closeStory(); closeSheet(); showProfile(el.dataset.id, S.tab === 'profile' ? S.profileBack : S.tab); },
  'profile-back': () => switchTab(S.profileBack === 'profile' ? 'home' : S.profileBack),
  'edit-profile': openEditProfile,
  'pick-avatar': () => { S.pending = { kind: 'avatar' }; const fi = $('file-input'); fi.accept = 'image/jpeg,image/png,image/webp'; fi.value = ''; fi.click(); },
  'save-profile': el => saveProfile(el),
  'view-post': el => viewPost(el.dataset.id),
  'msg-user': el => messageUser(el.dataset.id, el),
  'open-conv': el => { const c = S.inbox.find(x => x.conversation_id === el.dataset.id); if (c) openConversation(c.conversation_id, { id: c.other_id, username: c.username, full_name: c.full_name, avatar_url: c.avatar_url }); },
  'conv-back': () => { S.activeConv = null; $('conv-view').style.display = 'none'; $('inbox-view').style.display = 'flex'; loadInbox(); },
  'send-msg': sendMsg,
  'create': openCreate,
  'pick': el => { closeSheet(); pickFile(el.dataset.kind); },
  'publish': el => publish(el),
  'story-add': () => pickFile('story'),
  'story-open': el => openStory(+el.dataset.i),
  'story-next': nextStory, 'story-prev': prevStory, 'story-close': closeStory, 'story-delete': deleteStory,
  'story-profile': el => { closeStory(); showProfile(el.dataset.id, S.tab); },
  'reel-toggle': el => { el.paused ? el.play().catch(() => {}) : el.pause(); },
  'sound': toggleSound,
  'close-sheet': (el, e) => { if (e.target === el) closeSheet(); },
  'google': signInGoogle,
  'toggle-mode': toggleMode,
  'auth-submit': el => authSubmit(el),
  'forgot': () => { $('forgot-email').value = $('auth-email').value; showAuth('auth-forgot'); },
  'send-reset': el => sendReset(el),
  'verify-otp': el => verifyOtp(el),
  'resend-otp': el => resendOtp(el),
  'auth-back': () => showAuth('auth-main'),
  'set-password': el => setPassword(el)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || !e.target.dataset || !e.target.dataset.enter) return;
  e.preventDefault();
  const fn = actions[e.target.dataset.enter];
  if (fn) fn(e.target, e);
});
document.addEventListener('dblclick', e => {
  const box = e.target.closest('[data-dbl]');
  if (box && !S.likedIds.has(box.dataset.dbl)) toggleLike(box.dataset.dbl);
});
$('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  if (S.pending && S.pending.kind === 'avatar') {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return toast('الصورة لازم JPG أو PNG أو WebP', 'err');
    if (file.size > 5 * 1024 * 1024) return toast('الصورة كبيرة، الحد 5 ميجا', 'err');
    S.newAvatar = file;
    const img = $('edit-avatar'); if (img) img.src = URL.createObjectURL(file);
    S.pending = null; return;
  }
  onFileChosen(file);
});
$('search-input').addEventListener('input', e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(e.target.value), 300); });
</script>
</body>
